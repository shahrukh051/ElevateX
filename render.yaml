services:
  - type: web
    name: elevatex-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"

  - type: web
    name: elevatex-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && VITE_WS_URL="wss://${BACKEND_HOST}/ws" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: elevatex-backend
          property: host
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false   # Set manually in Render dashboard — never commit the real key
      - key: VITE_GOOGLE_MAPS_MAP_ID
        sync: false   # Optional — needed for vector/cloud-based map styles
