services:
  - type: web
    name: elevatex-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"

  - type: web
    name: elevatex-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_WS_URL
        fromService:
          type: web
          name: elevatex-backend
          property: host
